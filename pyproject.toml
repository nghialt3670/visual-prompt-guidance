[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-prompt-guidance"
version = "0.9.0"
description = "Composable spatial-attention guidance for generative models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["generative-models", "diffusion", "guidance", "visual-prompts", "attention"]
dependencies = ["torch>=2.6", "numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
flux2 = ["diffusers>=0.43,<0.44", "transformers>=4.57", "accelerate>=1.5"]
pix2pix = ["diffusers>=0.43,<0.44", "transformers>=4.57", "accelerate>=1.5"]
ui = ["gradio>=6,<7", "matplotlib>=3.9", "plotly>=5.0"]
perceptual = ["lpips>=0.1.4"]
dataset = ["requests>=2.31", "scipy>=1.11", "scikit-image>=0.22"]
dev = ["pytest>=8"]
all = ["diffusers>=0.43,<0.44", "transformers>=4.57", "accelerate>=1.5", "gradio>=6,<7", "matplotlib>=3.9", "plotly>=5.0", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
